<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pitha Khor</title>
</head>
<body>
    <header>
        <h2>Mahiner Mar Pithar Dokan</h2>
    </header>
    <main>
        <section>
            <form >
                <label for="name">Your Name:</label>
                <input type="text" name="" id="name">

                <label for="email">Your Email: </label>
                <input type="email" name="" id="email">

                <fieldset>
                    <legend>Pitha Info</legend>

                    <input type="radio" name="pitha" id="chitoi">
                    <label for="chitoi">Chotoi</label>

                    <input type="radio" name="pitha" id="vapa">
                    <label for="vapa">Vapa</label>

                    <input type="radio" name="pitha" id="dim-pitha">
                    <label for="dim-pitha">Dim Pitha</label>
                </fieldset>

                <fieldset>
                    <legend>Vorta Selection</legend>

                    <input type="checkbox" name="vorta" id="sorisa">
                    <label for="sorisa">Sorisa</label>

                    <input type="checkbox" name="vorta" id="morich">
                    <label for="morich">Morich</label>

                    <input type="checkbox" name="vorta" id="sotki">
                    <label for="sotki">Sotki</label>
                </fieldset>
                <fieldset>
                    <legend>Extra Information</legend>
                    <textarea cols="50" rows="4" name="" id=""></textarea>
                </fieldset>

                <input type="submit" value="Submit">
                <input type="reset" value="Clear">

            </form>
        </section>
    </main>
    <footer>

    </footer>
</body>
</html>
