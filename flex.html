<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore Flex</title>
    <style>
        .container{
            display: flex;
        }
        .container div{
            border: 2px solid tomato;
            height: 100px;
            font-size: 2em;
            width: 200px;
        }

        .box-container{
            display: flex;
        }
        .box{
            border: 3px solid green;
            height: 200px;
            width: 200px;
            font-size: 4em;
            font-weight: 700;
        }
        .user-container{
            display: flex;
            /* justify-content:space-between; */
            /* justify-content:end; */
            justify-content: space-evenly;
        }
        .user{
            border: 3px solid rgb(8, 8, 201);
            height: 150px;
            width: 150px;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Explore Display Flex</h1>
    <div class="container">
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
        <div>5</div>
    </div>
<br>
    <div class="box-container">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
    </div>
<br>
    <div class="user-container">
        <div class="user">user1</div>
        <div class="user">user2</div>
        <div class="user">user3</div>
        <div class="user">user4</div>
        <div class="user">user5</div>
        <div class="user">user6</div>
    </div>
</body>
</html>
